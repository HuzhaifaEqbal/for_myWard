<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="nuc" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="60%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </radialGradient>
    <radialGradient id="elec" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="60%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </radialGradient>
    <radialGradient id="cloud" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="atomglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Probability Cloud (1s Orbital) -->
  <circle cx="256" cy="256" r="220" fill="url(#cloud)"/>
  <!-- Quantum Orbital Paths -->
  <ellipse cx="256" cy="256" rx="200" ry="75" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.6" transform="rotate(-30 256 256)"/>
  <ellipse cx="256" cy="256" rx="200" ry="75" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.6" transform="rotate(30 256 256)"/>
  <ellipse cx="256" cy="256" rx="200" ry="75" fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.6" transform="rotate(90 256 256)"/>
  <!-- Center Nucleus (Proton) -->
  <circle cx="256" cy="256" r="32" fill="url(#nuc)" filter="url(#atomglow)"/>
  <text x="256" y="263" fill="#ffffff" font-size="22" font-family="Arial, sans-serif" font-weight="bold" text-anchor="middle">1p⁺</text>
  <!-- Orbiting Electron -->
  <g transform="rotate(-30 256 256)">
    <circle cx="456" cy="256" r="16" fill="url(#elec)" filter="url(#atomglow)"/>
    <text x="456" y="261" fill="#ffffff" font-size="14" font-family="Arial, sans-serif" font-weight="bold" text-anchor="middle">e⁻</text>
  </g>
</svg>
