<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="cytoplasm" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="60%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </radialGradient>
    <radialGradient id="nucleus" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="60%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#581c87"/>
    </radialGradient>
    <filter id="cellglow">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Outer Cell Membrane -->
  <path d="M 256 50 C 400 45 470 140 460 270 C 450 400 360 465 240 460 C 110 455 50 370 55 240 C 60 120 140 55 256 50 Z" fill="url(#cytoplasm)" opacity="0.85" filter="url(#cellglow)"/>
  <path d="M 256 50 C 400 45 470 140 460 270 C 450 400 360 465 240 460 C 110 455 50 370 55 240 C 60 120 140 55 256 50 Z" fill="none" stroke="#bbf7d0" stroke-width="4" opacity="0.9"/>
  <!-- Nucleus -->
  <circle cx="230" cy="230" r="75" fill="url(#nucleus)" filter="url(#cellglow)"/>
  <!-- Nucleolus -->
  <circle cx="215" cy="215" r="28" fill="#f43f5e"/>
  <!-- Mitochondria -->
  <g transform="translate(330, 160) rotate(35)">
    <ellipse cx="0" cy="0" rx="42" ry="22" fill="#ea580c"/>
    <path d="M -30 0 Q -15 -10 0 0 Q 15 10 30 0" fill="none" stroke="#ffedd5" stroke-width="2.5"/>
  </g>
  <g transform="translate(140, 340) rotate(-25)">
    <ellipse cx="0" cy="0" rx="38" ry="20" fill="#ea580c"/>
    <path d="M -26 0 Q -13 -8 0 0 Q 13 8 26 0" fill="none" stroke="#ffedd5" stroke-width="2.5"/>
  </g>
  <!-- Endoplasmic Reticulum Ribbons -->
  <path d="M 270 290 Q 320 330 350 290 Q 380 260 320 350" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
</svg>
