<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="strand1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="strand2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>
    <filter id="dnaglow">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background Glow -->
  <circle cx="256" cy="256" r="230" fill="#0369a1" opacity="0.08"/>
  <!-- DNA Base pairs (rungs) -->
  <g stroke-width="4" stroke-linecap="round" filter="url(#dnaglow)">
    <line x1="200" y1="80" x2="312" y2="80" stroke="#f59e0b" />
    <line x1="180" y1="120" x2="332" y2="120" stroke="#10b981" />
    <line x1="170" y1="160" x2="342" y2="160" stroke="#6366f1" />
    <line x1="180" y1="200" x2="332" y2="200" stroke="#ef4444" />
    <line x1="210" y1="240" x2="302" y2="240" stroke="#f59e0b" />
    
    <line x1="240" y1="270" x2="272" y2="270" stroke="#10b981" />
    
    <line x1="210" y1="300" x2="302" y2="300" stroke="#6366f1" />
    <line x1="180" y1="340" x2="332" y2="340" stroke="#ef4444" />
    <line x1="170" y1="380" x2="342" y2="380" stroke="#f59e0b" />
    <line x1="180" y1="420" x2="332" y2="420" stroke="#10b981" />
  </g>
  <!-- Double Helix Helical Waves -->
  <path d="M 200 60 C 130 150 130 230 256 270 C 382 310 382 390 312 450" fill="none" stroke="url(#strand1)" stroke-width="8" stroke-linecap="round" filter="url(#dnaglow)"/>
  <path d="M 312 60 C 382 150 382 230 256 270 C 130 310 130 390 200 450" fill="none" stroke="url(#strand2)" stroke-width="8" stroke-linecap="round" filter="url(#dnaglow)"/>
  <!-- Nucleotide Nodes -->
  <circle cx="200" cy="80" r="6" fill="#38bdf8"/>
  <circle cx="312" cy="80" r="6" fill="#ec4899"/>
  <circle cx="180" cy="120" r="6" fill="#38bdf8"/>
  <circle cx="332" cy="120" r="6" fill="#ec4899"/>
  <circle cx="170" cy="160" r="6" fill="#38bdf8"/>
  <circle cx="342" cy="160" r="6" fill="#ec4899"/>
  <circle cx="180" cy="200" r="6" fill="#38bdf8"/>
  <circle cx="332" cy="200" r="6" fill="#ec4899"/>
</svg>
