<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="hglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f7be1d" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bodygrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <filter id="glowf">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Vitruvian Measurement Circle & Square -->
  <circle cx="256" cy="256" r="230" fill="url(#hglow)"/>
  <circle cx="256" cy="256" r="215" fill="none" stroke="#f7be1d" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.4"/>
  <rect x="56" y="56" width="400" height="400" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.25"/>
  <!-- Head -->
  <circle cx="256" cy="90" r="32" fill="url(#bodygrad)" filter="url(#glowf)"/>
  <!-- Torso -->
  <path d="M 230 135 L 282 135 L 272 270 L 240 270 Z" fill="url(#bodygrad)" filter="url(#glowf)"/>
  <!-- Arms Open (Vitruvian Style) -->
  <path d="M 230 145 L 80 180 L 85 200 L 230 165 Z" fill="url(#bodygrad)" filter="url(#glowf)"/>
  <path d="M 282 145 L 432 180 L 427 200 L 282 165 Z" fill="url(#bodygrad)" filter="url(#glowf)"/>
  <!-- Arms Up -->
  <path d="M 230 145 L 110 95 L 120 80 L 240 135 Z" fill="url(#bodygrad)" opacity="0.6"/>
  <path d="M 282 145 L 402 95 L 392 80 L 272 135 Z" fill="url(#bodygrad)" opacity="0.6"/>
  <!-- Legs Straight -->
  <path d="M 240 270 L 225 450 L 245 450 L 254 285 Z" fill="url(#bodygrad)" filter="url(#glowf)"/>
  <path d="M 272 270 L 287 450 L 267 450 L 258 285 Z" fill="url(#bodygrad)" filter="url(#glowf)"/>
  <!-- Legs Spread -->
  <path d="M 240 270 L 155 435 L 175 445 L 250 285 Z" fill="url(#bodygrad)" opacity="0.6"/>
  <path d="M 272 270 L 357 435 L 337 445 L 262 285 Z" fill="url(#bodygrad)" opacity="0.6"/>
</svg>
