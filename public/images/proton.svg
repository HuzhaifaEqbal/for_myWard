<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="pbg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#1d4ed8" stop-opacity="0.5"/>
      <stop offset="85%" stop-color="#1e1b4b" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="u1" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fca5a5"/>
      <stop offset="40%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </radialGradient>
    <radialGradient id="u2" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="40%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#14532d"/>
    </radialGradient>
    <radialGradient id="d1" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="40%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Outer Proton Cloud -->
  <circle cx="256" cy="256" r="230" fill="url(#pbg)"/>
  <circle cx="256" cy="256" r="210" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.6"/>
  <!-- Gluon Fields (Flux Tubes) -->
  <path d="M 210 180 Q 256 220 300 290 Q 230 310 190 280 Q 210 230 210 180" fill="none" stroke="#fbbf24" stroke-width="3" stroke-dasharray="5 5" opacity="0.8" filter="url(#glow)"/>
  <path d="M 210 180 Q 280 200 300 290" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.7"/>
  <path d="M 300 290 Q 230 330 190 280" fill="none" stroke="#f472b6" stroke-width="2" opacity="0.7"/>
  <path d="M 190 280 Q 170 210 210 180" fill="none" stroke="#4ade80" stroke-width="2" opacity="0.7"/>
  <!-- Up Quark 1 -->
  <circle cx="210" cy="180" r="42" fill="url(#u1)" filter="url(#glow)"/>
  <text x="210" y="188" fill="#ffffff" font-size="24" font-family="Arial, sans-serif" font-weight="bold" text-anchor="middle">u</text>
  <text x="210" y="145" fill="#fca5a5" font-size="12" font-family="Arial, sans-serif" text-anchor="middle">+2/3 e</text>
  <!-- Up Quark 2 -->
  <circle cx="300" cy="290" r="42" fill="url(#u2)" filter="url(#glow)"/>
  <text x="300" y="298" fill="#ffffff" font-size="24" font-family="Arial, sans-serif" font-weight="bold" text-anchor="middle">u</text>
  <text x="300" y="348" fill="#86efac" font-size="12" font-family="Arial, sans-serif" text-anchor="middle">+2/3 e</text>
  <!-- Down Quark -->
  <circle cx="190" cy="280" r="38" fill="url(#d1)" filter="url(#glow)"/>
  <text x="190" y="287" fill="#ffffff" font-size="22" font-family="Arial, sans-serif" font-weight="bold" text-anchor="middle">d</text>
  <text x="190" y="335" fill="#93c5fd" font-size="12" font-family="Arial, sans-serif" text-anchor="middle">-1/3 e</text>
</svg>
