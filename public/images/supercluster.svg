<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="scglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.9"/>
      <stop offset="25%" stop-color="#ec4899" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="filaglow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background Cosmic Fog -->
  <circle cx="256" cy="256" r="240" fill="url(#scglow)"/>
  <!-- Cosmic Filaments (Laniakea Streams) -->
  <g stroke-linecap="round" filter="url(#filaglow)">
    <path d="M 120 100 Q 200 180 256 256 Q 320 340 420 400" fill="none" stroke="#fde68a" stroke-width="3" opacity="0.8"/>
    <path d="M 380 90 Q 300 190 256 256 Q 200 320 100 380" fill="none" stroke="#f472b6" stroke-width="2.5" opacity="0.8"/>
    <path d="M 70 230 Q 180 250 256 256 Q 360 270 440 220" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.7"/>
    <path d="M 230 60 Q 245 160 256 256 Q 270 380 290 460" fill="none" stroke="#a78bfa" stroke-width="2" opacity="0.7"/>
  </g>
  <!-- Galaxy Cluster Nodes -->
  <g fill="#ffffff" filter="url(#filaglow)">
    <circle cx="256" cy="256" r="14" fill="#fffbeb"/>
    <circle cx="256" cy="256" r="22" fill="#fef08a" opacity="0.5"/>
    <circle cx="200" cy="180" r="6"/>
    <circle cx="320" cy="340" r="7"/>
    <circle cx="300" cy="190" r="5"/>
    <circle cx="200" cy="320" r="6"/>
    <circle cx="180" cy="250" r="5"/>
    <circle cx="360" cy="270" r="6"/>
    <circle cx="140" cy="130" r="4"/>
    <circle cx="380" cy="370" r="5"/>
  </g>
  <!-- Surrounding Galaxy Specks -->
  <g fill="#93c5fd" opacity="0.6">
    <circle cx="110" cy="180" r="2"/>
    <circle cx="160" cy="90" r="2.5"/>
    <circle cx="290" cy="110" r="2"/>
    <circle cx="390" cy="160" r="3"/>
    <circle cx="410" cy="290" r="2"/>
    <circle cx="340" cy="420" r="2.5"/>
    <circle cx="210" cy="420" r="2"/>
    <circle cx="90" cy="330" r="3"/>
  </g>
</svg>
